name: CI

on:
  push:
  pull_request:

jobs:
  serving:
    runs-on: ubuntu-latest
    # The serving tests are integration tests against a REAL Postgres - the rules
    # under test (paging by view exclusion, retired cards never surfacing,
    # erasure) live in SQL and triggers, so a mock would test nothing. This job
    # had no database, so `npm test` failed on every push since the first commit
    # while passing locally, where Docker's Postgres happened to be running. The
    # suite's global setup creates `instacram_test` itself, as this superuser.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: instacram
          POSTGRES_PASSWORD: instacram
          POSTGRES_DB: instacram
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/serving
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: instacram
          POSTGRES_PASSWORD: instacram
          POSTGRES_DB: instacram
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/serving
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      # Applies cleanly to an empty database, and is a no-op on a second run.
      - run: npm run migrate
        env:
          DATABASE_URL: postgres://instacram:instacram@localhost:5432/instacram
      - run: npm run migrate
        env:
          DATABASE_URL: postgres://instacram:instacram@localhost:5432/instacram

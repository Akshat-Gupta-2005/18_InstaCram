name: CI

on:
  push:
  pull_request:

jobs:
  serving:
    runs-on: ubuntu-latest
    # The serving tests are integration tests against a REAL Postgres - the rules
    # under test (paging by view exclusion, retired cards never surfacing,
    # erasure) live in SQL and triggers, so a mock would test nothing. This job
    # had no database, so `npm test` failed on every push since the first commit
    # while passing locally, where Docker's Postgres happened to be running. The
    # suite's global setup creates `instacram_test` itself, as this superuser.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: instacram
          POSTGRES_PASSWORD: instacram
          POSTGRES_DB: instacram
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/serving
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  app:
    runs-on: ubuntu-latest
    # The Expo app (web, iOS, Android). Typecheck, then a production web export,
    # which compiles every route - the dev server only compiles routes on demand,
    # so a broken screen can hide until someone opens it.
    defaults:
      run:
        working-directory: clients/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # Expo writes this on `expo start`; it is gitignored, and tsc needs it to
      # resolve Expo's ambient types (the CSS import). Same one line Expo writes.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist

  pipeline:
    runs-on: ubuntu-latest
    # The topic worker's claim tests are SQL - SKIP LOCKED, a stale-claim window -
    # and run against a real Postgres, built from serving's migration files by
    # tests/conftest.py. Declared here from the start rather than after four red
    # runs, which is what serving's missing database cost (P34).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: instacram
          POSTGRES_PASSWORD: instacram
          POSTGRES_DB: instacram
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: instacram
          POSTGRES_PASSWORD: instacram
          POSTGRES_DB: instacram
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/serving
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      # Applies cleanly to an empty database, and is a no-op on a second run.
      - run: npm run migrate
        env:
          DATABASE_URL: postgres://instacram:instacram@localhost:5432/instacram
      - run: npm run migrate
        env:
          DATABASE_URL: postgres://instacram:instacram@localhost:5432/instacram
